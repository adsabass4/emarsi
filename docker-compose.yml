services:
  scanner:
    build: .
    image: emarsi-okx-ema-scanner:latest
    container_name: okx-ema-scanner
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Named volumes: initialized from the image so the non-root `node`
      # user can write to them (SQLite DB + log file persist across restarts).
      - data:/app/data
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  data:
    name: emarsi-data
  logs:
    name: emarsi-logs